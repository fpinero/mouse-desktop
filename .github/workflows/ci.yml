name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: rustup component add clippy rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      # The end to end test is left out on purpose: it needs an interactive desktop
      # session with virtual desktops, which a hosted runner does not have.
      - name: Test
        run: cargo test
