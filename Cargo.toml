[package]
name = "mouse-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Switch Windows virtual desktops with a mouse gesture, without Administrator privileges"
repository = "https://github.com/fpinero/mouse-desktop"
license = "MIT"
readme = "README.md"
keywords = ["windows", "virtual-desktop", "mouse", "gesture", "tray"]
categories = ["os::windows-apis"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_System_Registry", "Win32_Graphics_Gdi", "Win32_Security"] }

[dev-dependencies]
# COM and window creation, needed only by the end to end test.
windows-sys = { version = "0.61", features = [
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
] }
